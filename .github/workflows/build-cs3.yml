name: Analyze site and build CS3

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Authorized site URL"
        required: true
        type: string
      plugin_name:
        description: "Plugin display name"
        required: true
        default: "GeneratedProvider"
        type: string
      package_name:
        description: "Kotlin package name"
        required: true
        default: "com.darkneslord.generated"
        type: string
      content_type:
        description: "Content type"
        required: true
        type: choice
        options: [movie_tv, movie, tv, anime, live]
      max_pages:
        description: "Maximum same-origin pages (1-50)"
        required: true
        default: "25"
        type: string
      timeout_seconds:
        description: "Per-request timeout (3-25 seconds)"
        required: true
        default: "15"
        type: string
      seed_urls:
        description: "Optional extra seed URLs, one per line"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cs3-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze-generate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Accept remaining Android SDK licenses and install required packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager bulunamadı: $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install analyzer dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Analyze authorized website
        env:
          SITE_URL: ${{ inputs.site_url }}
          MAX_PAGES: ${{ inputs.max_pages }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          SEED_URLS: ${{ inputs.seed_urls }}
        run: |
          set -euo pipefail
          mkdir -p build
          python engine/site_engine.py \
            --url "$SITE_URL" \
            --max-pages "$MAX_PAGES" \
            --timeout "$TIMEOUT_SECONDS" \
            --seeds "$SEED_URLS" \
            --out build/analysis

      - name: Generate Kotlin CloudStream provider
        env:
          SITE_URL: ${{ inputs.site_url }}
          PLUGIN_NAME: ${{ inputs.plugin_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          CONTENT_TYPE: ${{ inputs.content_type }}
        run: |
          set -euo pipefail
          python engine/generate_provider.py \
            --analysis build/analysis/site-analysis.json \
            --out GeneratedProvider/src/main/kotlin
          test -s GeneratedProvider/src/main/AndroidManifest.xml

      - name: Validate generated source and analyzer
        run: |
          set -euo pipefail
          python -m py_compile engine/site_engine.py engine/generate_provider.py engine/verify_cs3.py
          python -m unittest discover -s tests -v 2>&1 | tee build/unit-tests.log

      - name: Build CS3 and plugin manifest
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          echo "Gradle version:" | tee build/gradle-build.log
          gradle --version 2>&1 | tee -a build/gradle-build.log
          echo "Build tasks:" | tee -a build/gradle-build.log
          gradle tasks --all --no-daemon 2>&1 | tee build/gradle-tasks.log
          gradle :GeneratedProvider:make makePluginsJson --no-daemon --stacktrace --info 2>&1 | tee -a build/gradle-build.log

      - name: Verify CS3 archive integrity
        if: success()
        run: python engine/verify_cs3.py --root . --out build/verification.json

      - name: Collect diagnostic reports
        if: always()
        shell: bash
        run: |
          mkdir -p build/artifacts
          find . -type f -name '*.cs3' -not -path './.git/*' -not -path './build/artifacts/*' -exec cp {} build/artifacts/ \; || true
          find . -type f -name 'plugins.json' -not -path './.git/*' -exec cp --parents {} build/artifacts/ \; || true
          cp README.md build/artifacts/ 2>/dev/null || true
          printf 'GitHub run: %s\nRepository: %s\nCommit: %s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_SHA" > build/artifacts/BUILD_STATUS.txt
          for f in build/verification.json build/provider-generation.json build/unit-tests.log build/gradle-build.log build/gradle-tasks.log; do
            if [ -f "$f" ]; then printf '\n\n===== %s =====\n' "$f" >> build/artifacts/BUILD_STATUS.txt; tail -n 250 "$f" >> build/artifacts/BUILD_STATUS.txt; fi
          done
          (cd build && zip -qr ../DL-CloudStream-Builder-Reports.zip analysis artifacts verification.json unit-tests.log gradle-build.log gradle-tasks.log 2>/dev/null) || true

      - name: Upload build, source and diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dl-cloudstream-builder-${{ github.run_number }}
          path: |
            DL-CloudStream-Builder-Reports.zip
            build/artifacts/**
            build/analysis/**
            build/verification.json
            build/provider-generation.json
            build/unit-tests.log
            build/gradle-build.log
            build/gradle-tasks.log
            GeneratedProvider/build/**/*.cs3
            GeneratedProvider/build/**/plugins.json
          if-no-files-found: warn
          retention-days: 14
